    /**
     * Menghasilkan tanggal hari ini dalam format ISO (YYYY-MM-DD) sesuai waktu lokal.
     */
    function getTodayISO() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /**
     * Menghasilkan jam saat ini dalam format HH:MM.
     */
    function getNowTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    /**
     * Escape karakter HTML untuk mencegah XSS saat merender string dinamis.
     */
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Normalisasi nomor WhatsApp Indonesia ke format internasional (628xxxxxxxxxx).
     */
    function normalizeWA(phone) {
      let cleaned = String(phone || '').replace(/[^0-9]/g, '');
      if (!cleaned) return '';
      if (cleaned.startsWith('0')) cleaned = '62' + cleaned.slice(1);
      else if (cleaned.startsWith('8')) cleaned = '62' + cleaned;
      return cleaned;
    }

    /**
     * Menampilkan pesan notifikasi singkat (toast) di pojok kanan atas.
     */
    function showToast(msg, type = 'success') {
      try {
        const box = document.getElementById('toast-box');
        if (!box) return;
        const el = document.createElement('div');
        const palette = type === 'error'
          ? 'bg-rose-600 text-white'
          : (type === 'info' ? 'bg-slate-800 text-white' : 'bg-emerald-700 text-white');
        el.className = `${palette} px-4 py-3 rounded-2xl shadow-lg text-xs font-bold pointer-events-auto transition-opacity duration-300`;
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 300);
        }, 2800);
      } catch (err) {
        console.error('Toast error:', err);
      }
    }

    function openModal(html) {

      panel.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    /**
     * Memuat basis data dari localStorage; jika belum ada atau rusak, inisialisasi data awal.
     */
    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.settings && Array.isArray(parsed.students)) {
            return {
              ...getInitialData(),
              ...parsed,
              settings: { ...getInitialData().settings, ...parsed.settings }
            };
          }
        }
      } catch (err) {
        console.warn('Gagal membaca localStorage, memakai data awal:', err);
      }
      const initial = getInitialData();
      saveDB(initial);
      return initial;
    }

    /**
     * Menyimpan state basis data ke localStorage.
     */
    function saveDB(data = db) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        console.error('Gagal menyimpan ke localStorage:', err);
      }
    }

    /**
     * Membentuk pesan WhatsApp personal untuk wali murid berdasarkan data siswa dan kondisi absensi/status.
     */
    function buildParentWAMessage(student, customType = 'info', extra = {}) {
      if (!student) return '';
      const today = extra.tanggal || getTodayISO();
      const jam = extra.jam || getNowTime();
      const status = extra.status || 'Terpantau';

      if (customType === 'masuk') {
        return db.settings.tplMasuk
          .replaceAll('{nama_wali}', student.namaWali || 'Bpk/Ibu Wali Murid')
          .replaceAll('{nama_siswa}', student.nama || '')
          .replaceAll('{kelas}', student.kelas || '')
          .replaceAll('{sekolah}', db.settings.schoolName || 'MA Nahdhiyah Talun')
          .replaceAll('{tanggal}', today)
          .replaceAll('{jam}', jam)
          .replaceAll('{status}', status);
      }

      if (customType === 'pulang') {
        return db.settings.tplPulang
          .replaceAll('{nama_wali}', student.namaWali || 'Bpk/Ibu Wali Murid')
          .replaceAll('{nama_siswa}', student.nama || '')
          .replaceAll('{kelas}', student.kelas || '')
          .replaceAll('{sekolah}', db.settings.schoolName || 'MA Nahdhiyah Talun')
          .replaceAll('{tanggal}', today)
          .replaceAll('{jam}', jam);
      }

      if (customType === 'izin') {
        return `Assalamualaikum Wr. Wb. Yth. *${student.namaWali || 'Bpk/Ibu Wali Murid'}*, informasi kehadiran ananda *${student.nama}* (NISN: ${student.nisn}, Kelas ${student.kelas}) di *${db.settings.schoolName}* pada tanggal *${today}*: Status *${status}*${extra.alasan ? ' (' + extra.alasan + ')' : ''}. Mohon perhatian dan kerja samanya.`;
      }

      return `Assalamualaikum Wr. Wb. Yth. *${student.namaWali || 'Bpk/Ibu Wali Murid'}*, wali dari ananda *${student.nama}* (NISN: ${student.nisn}, Kelas ${student.kelas}) — *${db.settings.schoolName}*.`;
    }

    /**
     * Mengirim pesan WA ke wali murid siswa tertentu (mencatat log, memanggil API jika aktif, dan membuka WA bila diperlukan).
     */
    async function notifyParentByNisn(nisn, msgType = 'info', extra = {}, forceOpenWA = true) {
      const student = db.students.find(s => s.nisn === nisn);
      if (!student) {
        showToast('Data siswa tidak ditemukan', 'error');
        return;
      }
      if (!normalizeWA(student.waWali)) {
        showToast(`Nomor WA wali ${student.nama} belum diisi`, 'error');
        return;
      }
      const message = buildParentWAMessage(student, msgType, extra);
      await sendWhatsAppMessage(student.waWali, `${student.namaWali} (Wali ${student.nama})`, message);
      if (forceOpenWA) {
        openWhatsAppUrl(student.waWali, message);
      }
      render();
    }

    /**
     * Membuka tautan WhatsApp (wa.me) dengan pesan terisi otomatis.
     */
    function openWhatsAppUrl(phone, text) {
      const norm = normalizeWA(phone);
      if (!norm) {
        showToast('Nomor WhatsApp tidak valid', 'error');
        return;
      }
      const url = `https://wa.me/${norm}?text=${encodeURIComponent(text || '')}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    /**
     * Mencatat log notifikasi WhatsApp (termasuk nomor Sender) dan mengirim via API Gateway jika dikonfigurasi.
     */
    async function sendWhatsAppMessage(phone, recipientName, message) {
      const norm = normalizeWA(phone);
      const senderNorm = normalizeWA(db.settings.waSender || '');
      const log = {
        id: 'WA-' + Math.floor(1000 + Math.random() * 9000),
        waktu: getTodayISO() + ' ' + getNowTime(),
        sender: senderNorm,
        penerima: recipientName,
        tujuan: norm,
        pesan: message,
        status: 'Diproses'
      };
      db.waLogs.unshift(log);

      if (db.settings.waMode === 'direct_wa' || !db.settings.waToken) {
        log.status = 'Siap Kirim WA';
        saveDB();
        return;
      }

      try {
        const formData = new FormData();
        formData.append('target', norm);
        if (senderNorm) formData.append('sender', senderNorm);
        formData.append('message', message);
        formData.append('countryCode', '62');
        const res = await fetch(db.settings.waEndpoint || 'https://api.fonnte.com/send', {
          method: 'POST',
          headers: { Authorization: db.settings.waToken },
          body: formData
        });
        log.status = res.ok ? 'Terkirim API' : 'Gagal API';
      } catch (err) {
        log.status = 'Gagal API';
      }
      saveDB();
    }

    /**
     * Menyimpan pengaturan WhatsApp (Nomor Sender, Konfirmasi Otomatis, Mode & Token).
     */
    function saveWASettings() {
      const senderEl = document.getElementById('set-wa-sender');
      const autoEl = document.getElementById('set-wa-auto');
      const modeEl = document.getElementById('set-wa-mode');
      const tokenEl = document.getElementById('set-wa-token');

      if (senderEl) db.settings.waSender = normalizeWA(senderEl.value);
      if (autoEl) db.settings.waAutoConfirm = Boolean(autoEl.checked);
      if (modeEl) db.settings.waMode = modeEl.value;
      if (tokenEl) db.settings.waToken = tokenEl.value.trim();

      saveDB();
      showToast('Pengaturan WA & Nomor Sender disimpan');
      render();
    }

    /**
     * Proses login pengguna berdasarkan ID dan PIN.
     */
    function handleLogin(username, pin) {
      const cleanUser = String(username || '').trim().toLowerCase();
      const cleanPin = String(pin || '').trim();
      const found = db.users.find(u => u.username === cleanUser && u.pin === cleanPin);
      if (!found) {
        showToast('ID Pengguna atau PIN salah (PIN bawaan: 1234)', 'error');
        return;
      }
      session = { username: found.username, role: found.role, nama: found.nama };
      activeTab = found.role === 'piket' ? 'scan' : (found.role === 'walimurid' ? 'walimurid' : 'dashboard');
      render();
    }

    /**
     * Login cepat berdasarkan peran.
     */
    function quickLogin(role) {
      const found = db.users.find(u => u.role === role);
      if (found) handleLogin(found.username, found.pin);
    }

    /**

        kioskLocked = true;
        activeTab = 'scan';
        render();
      } else {
        openModal(`
          <form onsubmit="unlockKiosk(event)" class="p-6 space-y-4">
            <h3 class="font-extrabold text-base text-slate-900">Buka Kunci Kios</h3>
            <p class="text-xs text-slate-500">Masukkan PIN Kios (bawaan: <b>${escapeHtml(db.settings.kioskPin)}</b>)</p>
            <input id="kiosk-pin-input" type="password" inputmode="numeric" required placeholder="PIN Kios" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Buka Kunci</button>
            </div>
          </form>
        `);
      }
    }

    /**
     * Validasi PIN untuk membuka kunci mode kios.
     */
    function unlockKiosk(e) {
      e.preventDefault();
      const inputEl = document.getElementById('kiosk-pin-input');
      const pinVal = inputEl ? inputEl.value.trim() : '';
      if (pinVal === db.settings.kioskPin) {
        kioskLocked = false;
        closeModal();
        showToast('Kunci kios dibuka');
        render();
      } else {
        showToast('PIN Kios salah!', 'error');
      }
    }

    /**
     * Memproses kode hasil scan barcode/QR atau input manual untuk absen masuk/pulang.
     */
    function processScan(rawCode) {
      const code = String(rawCode || '').trim();
      if (!code) return;

      const student = db.students.find(s => s.nisn === code);
      const staff = db.staff.find(st => st.pegId.toLowerCase() === code.toLowerCase());

      if (!student && !staff) {
        scanResult = {
          ok: false,
          title: 'Kode Tidak Terdaftar',
          msg: `ID / NISN "${code}" tidak ditemukan di Database.`
        };
        showToast('Kode tidak terdaftar', 'error');
        render();
        return;
      }

      const today = getTodayISO();
      const now = getNowTime();
      const kode = student ? student.nisn : staff.pegId;
      const nama = student ? student.nama : staff.nama;
      const tipe = student ? 'Siswa' : (staff.kategori || 'Guru');
      const unit = student ? student.kelas : staff.jabatan;

      let record = db.attendance.find(a => a.tanggal === today && a.kode === kode);

      if (scanMode === 'masuk') {
        if (record && record.jamMasuk) {
          scanResult = {
            ok: false,
            title: 'Sudah Absen Masuk',
            msg: `${nama} sudah absen masuk pukul ${record.jamMasuk} WIB.`
          };
          render();
          return;
        }

        const kelasObj = student ? db.classes.find(c => c.nama === student.kelas) : null;
        const targetIn = (kelasObj && kelasObj.jamMasuk) ? kelasObj.jamMasuk : db.settings.jamMasuk;
        const [hTarget, mTarget] = targetIn.split(':').map(Number);
        const [hNow, mNow] = now.split(':').map(Number);
        const isLate = (hNow * 60 + mNow) > (hTarget * 60 + mTarget + Number(db.settings.toleransiMenit || 0));
        const status = isLate ? 'Terlambat' : 'Hadir';

        if (record) {
          record.jamMasuk = now;
          record.status = status;
        } else {
          db.attendance.unshift({
            id: 'ATT-' + Date.now(),
            tanggal: today,
            tipe,
            kode,
            nama,
            kelasUnit: unit,
            jamMasuk: now,
            jamPulang: '',
            status
          });
        }

        let waText = '';
        let waAutoOpened = false;
        if (student) {
          waText = buildParentWAMessage(student, 'masuk', { tanggal: today, jam: now, status });
          sendWhatsAppMessage(student.waWali, `${student.namaWali} (${student.nama})`, waText);
          if (db.settings.waAutoConfirm && normalizeWA(student.waWali)) {
            openWhatsAppUrl(student.waWali, waText);
            waAutoOpened = true;
          }
        }

        scanResult = {
          ok: true,
          title: `Absen Masuk Berhasil (${status})`,
          msg: `${nama} (${kode}) tercatat pukul ${now} WIB${waAutoOpened ? ' • Konfirmasi WA otomatis dipicu' : ''}`,
          waPhone: student ? student.waWali : '',
          waText,
          waAutoOpened
        };
      } else {
        if (!record || !record.jamMasuk) {
          scanResult = {
            ok: false,
            title: 'Belum Absen Masuk',
            msg: `${nama} belum tercatat masuk hari ini.`
          };
          render();
          return;
        }
        if (record.jamPulang) {
          scanResult = {
            ok: false,
            title: 'Sudah Absen Pulang',
            msg: `${nama} sudah absen pulang pukul ${record.jamPulang} WIB.`
          };
          render();
          return;
        }
        record.jamPulang = now;

        let waText = '';
        let waAutoOpened = false;
        if (student) {
          waText = buildParentWAMessage(student, 'pulang', { tanggal: today, jam: now, status: record.status || 'Hadir' });
          sendWhatsAppMessage(student.waWali, `${student.namaWali} (${student.nama})`, waText);
          if (db.settings.waAutoConfirm && normalizeWA(student.waWali)) {
            openWhatsAppUrl(student.waWali, waText);
            waAutoOpened = true;
          }
        }

        scanResult = {
          ok: true,
          title: 'Absen Pulang Berhasil',
          msg: `${nama} (${kode}) pulang pukul ${now} WIB${waAutoOpened ? ' • Konfirmasi WA otomatis dipicu' : ''}`,
          waPhone: student ? student.waWali : '',
          waText,
          waAutoOpened
        };
      }

      saveDB();
      showToast(scanResult.title);
      render();
    }

    /**
     * Menyalakan pemindai kamera menggunakan html5-qrcode.
     */
    async function startCamera() {
      if (cameraActive) return;
      if (typeof Html5Qrcode === 'undefined') {
        showToast('Library kamera belum siap, gunakan input manual.', 'error');
        return;
      }
      try {
        qrScanner = new Html5Qrcode('qr-reader');
        await qrScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 260, height: 140 } },
          (decoded) => {
            const clean = String(decoded || '').trim();
            const nowTs = Date.now();
            if (clean && (clean !== lastCode || nowTs - lastScanTs > 2500)) {
              lastCode = clean;
              lastScanTs = nowTs;
              processScan(clean);
            }
          },
          () => {}
        );
        cameraActive = true;
        render();
      } catch (err) {
        showToast('Kamera tidak dapat dibuka: ' + (err.message || err), 'error');
      }
    }

    /**
     * Menghentikan pemindai kamera aktif.
     */
    async function stopCamera() {
      if (qrScanner && cameraActive) {
        try {
          await qrScanner.stop();
          await qrScanner.clear();
        } catch (err) {
          console.warn('Gagal menghentikan kamera:', err);
        }
      }
      qrScanner = null;
      cameraActive = false;
    }

    function toggleHariAktif(day) {
      const inp = document.getElementById('f-c-hari');
      if (!inp) return;
      const cur = inp.value.trim();
      if (!cur || cur.includes(' - ')) {
        inp.value = day;
        return;
      }
      const parts = cur.split(',').map(s => s.trim()).filter(Boolean);
      const idx = parts.indexOf(day);
      if (idx >= 0) parts.splice(idx, 1);
      else parts.push(day);
      inp.value = parts.join(', ');
    }

          ['T-010', 'Ahmad Fauzan, S.Kom', 'Staf Tata Usaha', '081234567894'],

    function handleExcelUpload(event, tab) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap.', 'error');
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rows.length) {
            showToast('File Excel kosong atau format kolom tidak sesuai.', 'error');
            return;
          }

          let addedCount = 0;
          let updatedCount = 0;

          rows.forEach((row) => {
            const normRow = {};
            Object.keys(row).forEach(k => {
              normRow[String(k).trim().toLowerCase().replace(/\s+/g, '_')] = String(row[k] ?? '').trim();
            });

            if (tab === 'siswa') {
              const nisn = normRow.nisn || normRow.kode || '';
              const nama = normRow.nama_lengkap || normRow.nama || '';
              const kelas = normRow.kelas || db.classes[0]?.nama || 'X IPA 1';
              const namaWali = normRow.nama_wali_murid || normRow.nama_wali || normRow.wali_murid || '-';
              const waWali = normalizeWA(normRow.no_wa_wali || normRow.wa_wali || normRow.no_wa || '');
              if (!nisn || !nama) return;

              const existingIdx = db.students.findIndex(s => s.nisn === nisn);
              const payload = { nisn, nama, kelas, namaWali, waWali };
              if (existingIdx >= 0) {
                db.students[existingIdx] = payload;
                updatedCount++;
              } else {
                db.students.push(payload);
                addedCount++;
              }
            } else if (tab === 'guru' || tab === 'tendik') {
              const kategori = tab === 'tendik' ? 'Tendik' : 'Guru';
              const pegId = normRow.id_pegawai || normRow.pegid || normRow.kode || '';
              const nama = normRow.nama_lengkap || normRow.nama || '';
              const jabatan = normRow.jabatan_mapel || normRow.jabatan_unit || normRow.jabatan || '-';
              const wa = normalizeWA(normRow.no_wa || normRow.wa || '');
              if (!pegId || !nama) return;

              const existingIdx = db.staff.findIndex(st => st.pegId.toLowerCase() === pegId.toLowerCase());
              const payload = { pegId, nama, kategori, jabatan, wa };
              if (existingIdx >= 0) {
                db.staff[existingIdx] = payload;
                updatedCount++;
              } else {
                db.staff.push(payload);
                addedCount++;
              }
            } else if (tab === 'kelas') {
              const nama = normRow.nama_kelas || normRow.kelas || '';
              const jenjang = normRow.jenjang || 'MA';
              const tingkat = normRow.tingkat || 'X';
              const jurusan = normRow.jurusan || '';
              const ruang = normRow.ruang || '';
              const kapasitas = Number(normRow.kapasitas) || 36;
              const hariAktif = normRow.hari_aktif || 'Senin - Sabtu';
              const waliKelas = normRow.nama_wali_kelas || normRow.wali_kelas || '-';
              const waWaliKelas = normalizeWA(normRow.no_wa_wali_kelas || normRow.wa_wali_kelas || '');
              const jamMasuk = normRow.jam_masuk || db.settings.jamMasuk;
              const jamPulang = normRow.jam_pulang || db.settings.jamPulang;
              if (!nama) return;

              const existingIdx = db.classes.findIndex(c => c.nama.toLowerCase() === nama.toLowerCase());
              const payload = {
                id: existingIdx >= 0 ? db.classes[existingIdx].id : ('KLS-' + (db.classes.length + 1)),
                nama,
                jenjang,
                tingkat,
                jurusan,
                ruang,
                kapasitas,
                hariAktif,
                waliKelasId: existingIdx >= 0 ? db.classes[existingIdx].waliKelasId : '',
                waliKelas,
                waWaliKelas,
                jamMasuk,
                jamPulang
              };
              if (existingIdx >= 0) {
                db.classes[existingIdx] = payload;
                updatedCount++;
              } else {
                db.classes.push(payload);
                addedCount++;
              }
            }
          });

          saveDB();
          showToast(`Import Excel selesai: ${addedCount} ditambah, ${updatedCount} diperbarui`);
          render();
        } catch (err) {
          showToast('Gagal membaca file Excel: ' + (err.message || 'Format tidak valid'), 'error');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    /**
     * Mengonversi elemen <svg> barcode menjadi data URL PNG beresolusi tinggi untuk disematkan ke PDF.
     */
    function svgElementToPngDataUrl(svgEl) {
      return new Promise((resolve) => {
        try {
          if (!svgEl) return resolve(null);
          const serializer = new XMLSerializer();
          const svgStr = serializer.serializeToString(svgEl);
          const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = function() {
            try {
              const scale = 3;
              const width = Math.max(img.width || 240, 240);
              const height = Math.max(img.height || 70, 70);
              const canvas = document.createElement('canvas');
              canvas.width = width * scale;
              canvas.height = height * scale;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const pngUrl = canvas.toDataURL('image/png');
              URL.revokeObjectURL(url);
              resolve({ dataUrl: pngUrl, ratio: width / height });
            } catch (err) {
              URL.revokeObjectURL(url);
              resolve(null);
            }
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            resolve(null);
          };
          img.src = url;
        } catch (err) {
          resolve(null);
        }
      });
    }

    /**
     * Membuat dan mengunduh lembar kartu barcode dalam format PDF (.pdf).
     */
    async function downloadBarcodePDF() {
      try {
        const jsPdfLib = window.jspdf && window.jspdf.jsPDF;
        if (!jsPdfLib) {
          showToast('Pustaka PDF sedang dimuat, coba beberapa detik lagi.', 'error');
          return;
        }

        if (typeof JsBarcode !== 'undefined') {
          document.querySelectorAll('.bc-svg').forEach(el => {
            try {
              JsBarcode(el, el.dataset.code, { format: 'CODE128', width: 1.6, height: 42, displayValue: true, fontSize: 12, margin: 2 });
            } catch (err) {}
          });
        }

        const cards = [
          ...db.students.map(s => ({
            code: s.nisn,
            nama: s.nama,
            badge: s.kelas,
            sub: `Wali: ${s.namaWali}`,
            accent: [6, 95, 70]
          })),
          ...db.staff.map(st => ({
            code: st.pegId,
            nama: st.nama,
            badge: st.kategori || 'Guru',
            sub: st.jabatan,
            accent: [67, 56, 202]
          }))
        ];

        if (!cards.length) {
          showToast('Tidak ada data kartu barcode untuk diunduh.', 'info');
          return;
        }

        showToast('Menyiapkan file PDF barcode...', 'info');

        const svgMap = {};
        const svgEls = Array.from(document.querySelectorAll('.bc-svg'));
        for (const el of svgEls) {
          const code = el.dataset.code;
          if (code && !svgMap[code]) {
            svgMap[code] = await svgElementToPngDataUrl(el);
          }
        }

        const doc = new jsPdfLib({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const marginX = 12;
        const marginTop = 22;
        const gapX = 6;
        const gapY = 6;
        const cols = 2;
        const rows = 4;
        const cardW = (pageWidth - marginX * 2 - gapX * (cols - 1)) / cols;
        const cardH = (pageHeight - marginTop - 12 - gapY * (rows - 1)) / rows;
        const perPage = cols * rows;

        function drawHeader(pageNum, totalPages) {
          doc.setFillColor(6, 95, 70);
          doc.rect(0, 0, pageWidth, 16, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.text(`KARTU BARCODE - ${String(db.settings.schoolName || 'MA NAHDHIYAH TALUN').toUpperCase()}`, marginX, 10.5);
          doc.setFontSize(8.5);
          doc.text(`Hal ${pageNum}/${totalPages}`, pageWidth - marginX, 10.5, { align: 'right' });
        }

        const totalPages = Math.max(1, Math.ceil(cards.length / perPage));
        drawHeader(1, totalPages);

        for (let i = 0; i < cards.length; i++) {
          const pageIndex = Math.floor(i / perPage);
          const posInPage = i % perPage;
          if (i > 0 && posInPage === 0) {
            doc.addPage();
            drawHeader(pageIndex + 1, totalPages);
          }

          const col = posInPage % cols;
          const row = Math.floor(posInPage / cols);
          const x = marginX + col * (cardW + gapX);
          const y = marginTop + row * (cardH + gapY);
          const item = cards[i];

          doc.setDrawColor(item.accent[0], item.accent[1], item.accent[2]);
          doc.setLineWidth(0.5);
          doc.setFillColor(255, 255, 255);
          doc.roundedRect(x, y, cardW, cardH, 3, 3, 'FD');

          doc.setFillColor(item.accent[0], item.accent[1], item.accent[2]);
          doc.roundedRect(x, y, cardW, 7.5, 3, 3, 'F');
          doc.rect(x, y + 4, cardW, 3.5, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(7.5);
          doc.text(String(db.settings.schoolName || 'MA Nahdhiyah Talun'), x + 3, y + 5);
          doc.text(String(item.badge || ''), x + cardW - 3, y + 5, { align: 'right' });

          doc.setTextColor(15, 23, 42);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.5);
          doc.text(String(item.nama || '').slice(0, 34), x + 3, y + 13.5);

          doc.setTextColor(100, 116, 139);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.5);
          doc.text(String(item.sub || '').slice(0, 44), x + 3, y + 18);

          const imgInfo = svgMap[item.code];
          const bcBoxY = y + 20.5;
          const bcBoxH = Math.max(18, cardH - 23);
          const bcBoxW = cardW - 6;
          if (imgInfo && imgInfo.dataUrl) {
            const maxW = bcBoxW;
            const maxH = bcBoxH;
            let drawW = maxW;
            let drawH = drawW / (imgInfo.ratio || 3);
            if (drawH > maxH) {
              drawH = maxH;
              drawW = drawH * (imgInfo.ratio || 3);
            }
            const drawX = x + 3 + (maxW - drawW) / 2;
            const drawY = bcBoxY + (maxH - drawH) / 2;
            doc.addImage(imgInfo.dataUrl, 'PNG', drawX, drawY, drawW, drawH);
          } else {
            doc.setFont('courier', 'bold');
            doc.setFontSize(10);
            doc.setTextColor(15, 23, 42);
            doc.text(String(item.code), x + cardW / 2, bcBoxY + bcBoxH / 2 + 2, { align: 'center' });
          }
        }

        const fileName = `Kartu_Barcode_MNT_${getTodayISO()}.pdf`;
        doc.save(fileName);
        showToast(`Berhasil mengunduh ${fileName}`);
      } catch (err) {
        console.error('PDF export error:', err);
        showToast('Gagal membuat file PDF barcode', 'error');
      }
    }

    function verifyIzin(id, approve) {
      const req = db.leaveRequests.find(r => r.id === id);
      if (!req) return;
      req.status = approve ? 'Disetujui' : 'Ditolak';
      if (approve) {
        const ex = db.attendance.find(a => a.tanggal === req.tanggal && a.kode === req.nisn);
        if (ex) ex.status = req.jenis;
        else {
          db.attendance.unshift({
            id: 'ATT-' + Date.now(),
            tanggal: req.tanggal,
            tipe: 'Siswa',
            kode: req.nisn,
            nama: req.nama,
            kelasUnit: req.kelas,
            jamMasuk: '-',
            jamPulang: '-',
            status: req.jenis
          });
        }
      }
      saveDB();
      showToast(`Pengajuan ${req.status.toLowerCase()}`);
      render();
    }

                  <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">

                      <button type="button" onclick="notifyParentByNisn('${escapeHtml(s.nisn)}', 'izin', { status: '${escapeHtml(statusNow)}' }, true)" class="px-2.5 py-1.5 rounded-lg bg-amber-600 text-white font-bold">📲 Info Wali</button>

    function renderReports() {
      const q = waLogSearch.toLowerCase().trim();
      const filteredLogs = db.waLogs.filter(l => {
        const matchStatus = waLogStatusFilter === 'ALL' || (l.status || '') === waLogStatusFilter;
        const matchQuery = !q
          || String(l.penerima || '').toLowerCase().includes(q)
          || String(l.tujuan || '').toLowerCase().includes(q)
          || String(l.sender || '').toLowerCase().includes(q)
          || String(l.pesan || '').toLowerCase().includes(q)
          || String(l.id || '').toLowerCase().includes(q);
        return matchStatus && matchQuery;
      });

      const statusOptions = Array.from(new Set(db.waLogs.map(l => l.status).filter(Boolean)));

      return `
        <div class="space-y-4">
          <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="text-lg font-extrabold text-slate-900">Laporan Absensi & Log WhatsApp</h2>
              <div class="flex gap-2">
                <button onclick="exportAttendanceCSV()" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">📥 Export CSV</button>
                <button onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">🖨️ Cetak</button>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold uppercase text-slate-500">
                    <th class="p-3">Tanggal</th>
                    <th class="p-3">Kode</th>
                    <th class="p-3">Nama</th>
                    <th class="p-3">Kategori</th>
                    <th class="p-3">Kelas/Jabatan</th>
                    <th class="p-3">Masuk</th>
                    <th class="p-3">Pulang</th>
                    <th class="p-3">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${db.attendance.map(a => {
                    const matchedStudent = a.tipe === 'Siswa' ? db.students.find(s => s.nisn === a.kode) : null;
                    return `
                    <tr>
                      <td class="p-3">${escapeHtml(a.tanggal)}</td>
                      <td class="p-3 font-mono">${escapeHtml(a.kode)}</td>
                      <td class="p-3 font-bold">${escapeHtml(a.nama)}</td>
                      <td class="p-3">${escapeHtml(a.tipe)}</td>
                      <td class="p-3">${escapeHtml(a.kelasUnit)}</td>
                      <td class="p-3">${escapeHtml(a.jamMasuk || '-')}</td>
                      <td class="p-3">${escapeHtml(a.jamPulang || '-')}</td>
                      <td class="p-3 font-bold">
                        <div class="flex items-center gap-2">
                          <span>${escapeHtml(a.status)}</span>
                          ${matchedStudent && matchedStudent.waWali ? `<button onclick="notifyParentByNisn('${escapeHtml(matchedStudent.nisn)}', '${a.jamPulang ? 'pulang' : 'masuk'}', { tanggal: '${escapeHtml(a.tanggal)}', jam: '${escapeHtml(a.jamPulang || a.jamMasuk || getNowTime())}', status: '${escapeHtml(a.status)}' }, true)" class="px-2 py-0.5 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[11px] font-bold border border-emerald-200">📲 WA Wali</button>` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="font-extrabold text-sm text-slate-900">Pengaturan WhatsApp, Nomor Sender & Riwayat Log WA (${filteredLogs.length}/${db.waLogs.length})</h3>
                <p class="text-[11px] text-slate-500">Atur nomor pengirim (Sender), konfirmasi WA otomatis saat scan, dan pantau riwayat pengiriman.</p>
              </div>
              <button type="button" onclick="confirmClearWALogs()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold">🗑️ Bersihkan Log</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 text-xs">
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nomor WA Sender</label>
                <input id="set-wa-sender" value="${escapeHtml(db.settings.waSender || '')}" placeholder="6281234567890" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-mono" />
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mode Kirim</label>
                <select id="set-wa-mode" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white">
                  <option value="direct_wa" ${db.settings.waMode === 'direct_wa' ? 'selected' : ''}>Buka Aplikasi WhatsApp (wa.me)</option>
                  <option value="api_fallback" ${db.settings.waMode === 'api_fallback' ? 'selected' : ''}>API Gateway (Fonnte/Wablas)</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Token API Gateway</label>
                <input id="set-wa-token" value="${escapeHtml(db.settings.waToken || '')}" placeholder="Token API (opsional)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-mono" />
              </div>
              <div class="flex flex-col justify-end gap-1.5">
                <label class="inline-flex items-center gap-2 text-[11px] font-bold text-slate-700 cursor-pointer select-none">
                  <input id="set-wa-auto" type="checkbox" ${db.settings.waAutoConfirm ? 'checked' : ''} class="rounded border-slate-300 text-emerald-700 focus:ring-emerald-600" />
                  <span>Konfirmasi WA Otomatis saat Scan</span>
                </label>
                <button type="button" onclick="saveWASettings()" class="w-full px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold">Simpan WA</button>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 pt-1 text-xs">
              <input type="text" value="${escapeHtml(waLogSearch)}" oninput="waLogSearch=this.value; render();" placeholder="Cari nama penerima, nomor tujuan/sender, atau isi pesan..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 bg-slate-50" />
              <select onchange="waLogStatusFilter=this.value; render();" class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white font-bold">
                <option value="ALL" ${waLogStatusFilter === 'ALL' ? 'selected' : ''}>Semua Status</option>
                ${statusOptions.map(st => `<option value="${escapeHtml(st)}" ${waLogStatusFilter === st ? 'selected' : ''}>${escapeHtml(st)}</option>`).join('')}
              </select>
            </div>

            <div class="divide-y divide-slate-100 text-xs">
              ${filteredLogs.slice(0, 25).map(l => {
                const badgeClass = String(l.status || '').includes('Gagal')
                  ? 'bg-rose-100 text-rose-800'
                  : (String(l.status || '').includes('Terkirim') ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800');
                return `
                <div class="py-3 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                  <div class="space-y-0.5 min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="font-mono text-[10px] text-slate-400">${escapeHtml(l.id)}</span>
                      <p class="font-bold text-slate-900">${escapeHtml(l.penerima)} <span class="font-mono font-normal text-slate-500">(+${escapeHtml(l.tujuan)})</span></p>
                      ${l.sender ? `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-mono text-[10px]">Sender: +${escapeHtml(l.sender)}</span>` : ''}
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeClass}">${escapeHtml(l.status || 'Tercatat')}</span>
                      <span class="text-[11px] text-slate-400">• ${escapeHtml(l.waktu)}</span>
                    </div>
                    <p class="text-slate-600 line-clamp-2">${escapeHtml(l.pesan)}</p>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button type="button" onclick="inspectWALog('${escapeHtml(l.id)}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">Detail</button>
                    <button onclick="openWhatsAppUrl('${escapeHtml(l.tujuan)}', decodeURIComponent('${encodeURIComponent(l.pesan)}'))" class="px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold">Kirim WA</button>
                  </div>
                </div>
              `;
              }).join('') || `<p class="text-slate-400 py-4 text-center">Belum ada riwayat log WhatsApp yang sesuai.</p>`}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Render utama aplikasi.
     */
    function render() {
      try {
        const app = document.getElementById('app');
        if (!app) return;

        if (!session) {
          app.innerHTML = renderLogin();
          return;
        }

        const menus = [
          { id: 'dashboard', label: 'Beranda', icon: '🏠', roles: ['admin', 'piket', 'walikelas'] },
          { id: 'scan', label: 'Scan Kios', icon: '📷', roles: ['admin', 'piket'] },
          { id: 'database', label: 'Database', icon: '🗄️', roles: ['admin', 'piket'] },
          { id: 'cards', label: 'Kartu Barcode', icon: '🪪', roles: ['admin', 'walikelas'] },
          { id: 'walikelas', label: 'Wali Kelas', icon: '📋', roles: ['admin', 'piket', 'walikelas'] },
          { id: 'walimurid', label: 'Wali Murid', icon: '👪', roles: ['admin', 'walimurid'] },
          { id: 'reports', label: 'Laporan & WA', icon: '📊', roles: ['admin', 'piket', 'walikelas'] }
        ].filter(m => m.roles.includes(session.role));

        if (!kioskLocked && !menus.some(m => m.id === activeTab) && menus.length > 0) {
          activeTab = menus[0].id;
        }

        let content = '';
        if (kioskLocked || activeTab === 'scan') content = renderScan();
        else if (activeTab === 'dashboard') content = renderDashboard();
        else if (activeTab === 'database') content = renderDatabase();
        else if (activeTab === 'cards') content = renderCards();
        else if (activeTab === 'walikelas') content = renderWaliKelas();
        else if (activeTab === 'walimurid') content = renderWaliMurid();
        else if (activeTab === 'reports') content = renderReports();

        app.innerHTML = `
          <div class="min-h-screen flex flex-col pb-20 md:pb-6">
            <header class="no-print sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3">
              <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-xl bg-emerald-800 text-white font-extrabold text-xs flex items-center justify-center shadow">${escapeHtml(db.settings.schoolInitials)}</div>
                  <div>
                    <h1 class="text-sm font-extrabold text-slate-900">${escapeHtml(db.settings.schoolName)}</h1>
                    <p class="text-[11px] text-slate-500">${escapeHtml(session.nama)} (${escapeHtml(session.role.toUpperCase())})</p>
                  </div>
                </div>
                <div class="flex items-center gap-1.5">
                  <button onclick="toggleKiosk()" class="px-3 py-1.5 rounded-xl text-xs font-bold ${kioskLocked ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-700'}">${kioskLocked ? '🔒 Terkunci' : '🔓 Kios'}</button>
                  ${!kioskLocked ? `<button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">Keluar</button>` : ''}
                </div>
              </div>
              ${!kioskLocked ? `
                <nav class="hidden md:flex max-w-5xl mx-auto gap-1.5 mt-3 pt-2.5 border-t border-slate-100 overflow-x-auto">
                  ${menus.map(m => `<button onclick="if(activeTab==='scan' && '${m.id}'!=='scan') stopCamera(); activeTab='${m.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold ${activeTab === m.id ? 'bg-emerald-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">${m.icon} ${m.label}</button>`).join('')}
                </nav>
              ` : ''}
            </header>

            <main class="flex-1 max-w-5xl w-full mx-auto p-4">${content}</main>

            ${!kioskLocked ? `
              <nav class="no-print md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 flex justify-around py-1.5 px-1 shadow-lg">
                ${menus.slice(0, 6).map(m => `<button onclick="if(activeTab==='scan' && '${m.id}'!=='scan') stopCamera(); activeTab='${m.id}'; render();" class="flex flex-col items-center py-1 px-1.5 rounded-xl ${activeTab === m.id ? 'text-emerald-800 font-extrabold' : 'text-slate-400'}"><span class="text-base">${m.icon}</span><span class="text-[10px] mt-0.5">${m.label}</span></button>`).join('')}
              </nav>
            ` : ''}
          </div>
        `;
      } catch (err) {
        console.error('Render error:', err);
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = `<div class="p-6 max-w-md mx-auto mt-10 bg-white rounded-2xl border border-rose-200 text-xs space-y-2"><p class="font-bold text-rose-700">Terjadi kendala saat menampilkan halaman.</p><p class="text-slate-600">${escapeHtml(err.message || err)}</p></div>`;
        }
      }
    }

    // Daftarkan service worker berbasis blob dengan scope relatif agar tidak 404 di subpath GitHub Pages
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        try {
          const swCode = `
            self.addEventListener('install', () => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        } catch (err) {}
      });
    }

    // Jalankan render pertama saat dokumen siap
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', render);
    } else {
      render();
    }
  </script>
